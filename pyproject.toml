[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pulso-support-agents"
version = "0.1.0"
description = "Multi-agent customer support for Pulso merchants and pulsers, built with LangGraph."
readme = "README.md"
license = "MIT"
authors = [{ name = "Alejandro Álvarez" }]
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.19",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langchain-core==1.7.4",
    "pydantic==2.14.2",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic==1.7.9"]
openai = ["langchain-openai==1.7.3"]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
]

[project.scripts]
pulso-evals = "pulso_support.evals:main"
pulso-demo = "pulso_support.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
